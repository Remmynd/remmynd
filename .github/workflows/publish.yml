name: Release

# Releases are cut by merging a version bump into main (see docs/RELEASING.md).
# When package.json on main has a version with no tag yet, this workflow:
#   1. runs the tests,
#   2. tags the commit vX.Y.Z,
#   3. creates the GitHub release with that version's notes from CHANGELOG.md,
#   4. publishes the npm package with provenance.
# npm trusts this file by name (trusted publishing, no npm token). Do not rename it.

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag, release and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest

      - name: Read version
        id: v
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then echo "tagged=true" >> "$GITHUB_OUTPUT"; fi
          if npm view "remmynd@$VERSION" version >/dev/null 2>&1; then echo "on_npm=true" >> "$GITHUB_OUTPUT"; fi

      - name: Nothing to release
        if: steps.v.outputs.tagged == 'true' && steps.v.outputs.on_npm == 'true'
        run: echo "v${{ steps.v.outputs.version }} is already tagged and on npm."

      - run: npm test
        if: steps.v.outputs.tagged != 'true' || steps.v.outputs.on_npm != 'true'

      - name: Release notes from CHANGELOG.md
        if: steps.v.outputs.tagged != 'true'
        run: node scripts/release-notes.mjs "${{ steps.v.outputs.version }}" > "$RUNNER_TEMP/notes.md"

      - name: Tag and create the GitHub release
        if: steps.v.outputs.tagged != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.v.outputs.tag }}" \
            --target "$GITHUB_SHA" \
            --title "remmynd ${{ steps.v.outputs.version }}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest

      - name: Publish to npm
        if: steps.v.outputs.on_npm != 'true'
        run: npm publish --access public --provenance
