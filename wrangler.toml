# remmynd on Cloudflare Workers: static files from public/, plus a tiny Worker for /ics.
# Deploy: npm run ship   (or push to main if the repo is connected to Workers Builds)
name = "remmynd"
main = "worker/index.js"
compatibility_date = "2025-10-01"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
# Send every request through worker/index.js first, so the www → bare-domain redirect also
# covers paths that are files (like / and /index.html). The Worker hands the rest to ASSETS.
run_worker_first = true

# Custom domains. Cloudflare creates their DNS records on deploy; these hostnames must not
# have any other A, AAAA or CNAME records in the remmynd.space DNS zone.
[[routes]]
pattern = "remmynd.space"
custom_domain = true

[[routes]]
pattern = "www.remmynd.space"
custom_domain = true
