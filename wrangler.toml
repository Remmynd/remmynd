POLAR_DISCOUNT_EARLY_YEARLY = "d401f496-eff0-43d2-a092-ad187e371e3c"
POLAR_DISCOUNT_EARLY_MONTHLY = "404bdebb-caf8-40e8-8845-fd9927b35b0a"
VAPID_PUBLIC_KEY = "BL1wKLc-1cGG7qJ-NS6KxwImTFfFVmp1YppjL7mdyXNjfHOTdjx9ThEfUb1aDx_3E8ACyw2yJ_gL3txgDQeQ3wg"
VAPID_SUBJECT = "mailto:connect@zoof04.com"
