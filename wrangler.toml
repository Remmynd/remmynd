# remmynd on Cloudflare Workers: static files from public/, plus a small Worker for /ics, the www redirect and push.
# Deploy: npm run ship   (or push to main if the repo is connected to Workers Builds)
name = "remmynd"
main = "worker/index.js"
compatibility_date = "2025-10-01"
workers_dev = true
# No per-version preview addresses; remmynd.space and the workers.dev address are enough.
preview_urls = false

# No logs: Workers observability stays off, so Cloudflare keeps no record of requests.
# A test in test/remmynd.test.js keeps it off.
[observability]
enabled = false

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
# Send every request through worker/index.js first, so the www → bare-domain redirect also
# covers paths that are files (like / and /index.html). The Worker hands the rest to ASSETS.
run_worker_first = true

# Custom domains. Cloudflare creates their DNS records on deploy; these hostnames must not
# have any other A, AAAA or CNAME records in the remmynd.space DNS zone.
[[routes]]
pattern = "remmynd.space"
custom_domain = true

[[routes]]
pattern = "www.remmynd.space"
custom_domain = true

# --- Push notifications: filled in by `npm run push:setup` ---
[[d1_databases]]
binding = "DB"
database_name = "remmynd"
database_id = "b0c76df1-abd8-4d65-8f0b-e3cd3d2156f2"

[triggers]
crons = ["* * * * *"]

